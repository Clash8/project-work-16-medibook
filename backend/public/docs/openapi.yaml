openapi: 3.0.3
info:
  title: MediBook API
  version: 1.0.0
  description: |
    API REST della piattaforma **MediBook**, applicazione full-stack API-based per la
    prenotazione di visite specialistiche e la gestione dei referti di una clinica privata.

    Le rotte protette richiedono un token di tipo Bearer rilasciato da `POST /api/login`
    oppure da `POST /api/register` (Laravel Sanctum).
  contact:
    name: Progetto MediBook
servers:
  - url: http://localhost:8000
    description: Ambiente di sviluppo locale

tags:
  - name: Autenticazione
    description: Registrazione, login, logout e profilo dell'utente autenticato.
  - name: Catalogo
    description: Specialita mediche, medici e disponibilita degli slot.
  - name: Appuntamenti
    description: Prenotazione, consultazione e annullamento delle visite.
  - name: Referti
    description: Emissione e consultazione degli esiti clinici.

paths:
  /api/register:
    post:
      tags: [Autenticazione]
      summary: Registra un nuovo paziente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, cognome, email, password, password_confirmation]
              properties:
                nome: { type: string, example: Marco }
                cognome: { type: string, example: Rossi }
                email: { type: string, format: email, example: marco.rossi@example.it }
                password: { type: string, format: password, example: password123 }
                password_confirmation: { type: string, format: password, example: password123 }
                telefono: { type: string, example: "3401234567" }
                codice_fiscale: { type: string, example: RSSMRC90A01F205X }
                data_nascita: { type: string, format: date, example: "1990-01-01" }
      responses:
        '201':
          description: Utente registrato, token rilasciato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RispostaAutenticazione' }
        '422': { $ref: '#/components/responses/ErroreValidazione' }

  /api/login:
    post:
      tags: [Autenticazione]
      summary: Autentica un utente e rilascia il token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: paziente@medibook.test }
                password: { type: string, format: password, example: password123 }
      responses:
        '200':
          description: Autenticazione riuscita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RispostaAutenticazione' }
        '422': { $ref: '#/components/responses/ErroreValidazione' }
        '429': { description: Troppi tentativi di accesso ravvicinati }

  /api/logout:
    post:
      tags: [Autenticazione]
      summary: Revoca il token corrente
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logout effettuato
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Logout effettuato con successo. }
        '401': { $ref: '#/components/responses/NonAutenticato' }

  /api/me:
    get:
      tags: [Autenticazione]
      summary: Profilo dell'utente autenticato
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dati dell'utente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Utente' }
        '401': { $ref: '#/components/responses/NonAutenticato' }

  /api/specialita:
    get:
      tags: [Catalogo]
      summary: Elenco delle specialita erogate dalla clinica
      responses:
        '200':
          description: Elenco delle specialita
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Specialita' }

  /api/specialita/{specialita}:
    get:
      tags: [Catalogo]
      summary: Dettaglio di una specialita
      parameters:
        - name: specialita
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Dettaglio della specialita
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Specialita' }
        '404': { $ref: '#/components/responses/NonTrovato' }

  /api/medici:
    get:
      tags: [Catalogo]
      summary: Elenco dei medici, opzionalmente filtrato per specialita
      parameters:
        - name: specialita
          in: query
          required: false
          description: Identificativo della specialita per cui filtrare i medici
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Elenco dei medici
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Medico' }
        '422': { $ref: '#/components/responses/ErroreValidazione' }

  /api/medici/{medico}:
    get:
      tags: [Catalogo]
      summary: Dettaglio di un medico
      parameters:
        - name: medico
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Dettaglio del medico
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Medico' }
        '404': { $ref: '#/components/responses/NonTrovato' }

  /api/disponibilita:
    get:
      tags: [Catalogo]
      summary: Slot prenotabili di un medico in una data
      parameters:
        - name: medico
          in: query
          required: true
          schema: { type: integer, example: 1 }
        - name: data
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-09-01" }
      responses:
        '200':
          description: Slot disponibili
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      medico_id: { type: integer, example: 1 }
                      data: { type: string, format: date, example: "2026-09-01" }
                      durata_visita_minuti: { type: integer, example: 30 }
                      slot:
                        type: array
                        items: { type: string, example: "09:00" }
        '422': { $ref: '#/components/responses/ErroreValidazione' }

  /api/appuntamenti:
    get:
      tags: [Appuntamenti]
      summary: Agenda dell'utente autenticato (paginata)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: stato
          in: query
          required: false
          schema: { type: string, enum: [prenotato, completato, annullato] }
        - name: page
          in: query
          required: false
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Elenco paginato degli appuntamenti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElencoAppuntamenti' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
    post:
      tags: [Appuntamenti]
      summary: Prenota una visita
      description: Operazione riservata agli utenti con ruolo `paziente`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medico_id, data_ora]
              properties:
                medico_id: { type: integer, example: 1 }
                data_ora: { type: string, example: "2026-09-01 09:00" }
                motivo: { type: string, example: Controllo di routine }
      responses:
        '201':
          description: Prenotazione creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appuntamento' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '409':
          description: Slot non più disponibile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }
        '422': { $ref: '#/components/responses/ErroreValidazione' }

  /api/appuntamenti/{appuntamento}:
    get:
      tags: [Appuntamenti]
      summary: Dettaglio di un appuntamento
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appuntamento
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Dettaglio dell'appuntamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appuntamento' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovato' }
    delete:
      tags: [Appuntamenti]
      summary: Annulla una prenotazione
      description: "L'annullamento è logico: lo stato passa ad annullato e lo storico resta consultabile."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appuntamento
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Prenotazione annullata
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Prenotazione annullata con successo. }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '422':
          description: La visita è già svolta oppure già annullata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errore' }

  /api/referti:
    get:
      tags: [Referti]
      summary: Elenco paginato dei referti visibili all'utente
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Elenco dei referti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElencoReferti' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
    post:
      tags: [Referti]
      summary: Emette il referto di una visita
      description: Operazione riservata al medico che ha effettuato la visita.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appuntamento_id, diagnosi, descrizione]
              properties:
                appuntamento_id: { type: integer, example: 1 }
                diagnosi: { type: string, example: Ipertensione arteriosa lieve }
                descrizione: { type: string, example: Pressione rilevata 145/90 mmHg. }
                prescrizione: { type: string, example: Controllo tra sei mesi. }
      responses:
        '201':
          description: Referto emesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Referto' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '422': { $ref: '#/components/responses/ErroreValidazione' }

  /api/referti/{referto}:
    get:
      tags: [Referti]
      summary: Dettaglio di un referto
      security: [{ bearerAuth: [] }]
      parameters:
        - name: referto
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Dettaglio del referto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Referto' }
        '401': { $ref: '#/components/responses/NonAutenticato' }
        '403': { $ref: '#/components/responses/NonAutorizzato' }
        '404': { $ref: '#/components/responses/NonTrovato' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token personale rilasciato da Laravel Sanctum.

  schemas:
    Utente:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nome: { type: string, example: Marco }
        cognome: { type: string, example: Rossi }
        nome_completo: { type: string, example: Marco Rossi }
        email: { type: string, format: email }
        ruolo: { type: string, enum: [paziente, medico, admin] }
        telefono: { type: string, nullable: true }
        codice_fiscale: { type: string, nullable: true }
        medico_id: { type: integer, nullable: true, description: Valorizzato per gli utenti con ruolo medico }

    RispostaAutenticazione:
      type: object
      properties:
        utente: { $ref: '#/components/schemas/Utente' }
        token: { type: string, example: 1|9sK2mQ... }

    Specialita:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nome: { type: string, example: Cardiologia }
        descrizione: { type: string, nullable: true }
        durata_visita_minuti: { type: integer, example: 30 }
        costo: { type: number, format: float, example: 120.00 }

    Medico:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nome_completo: { type: string, example: Dott. Giulia Bianchi }
        numero_albo: { type: string, example: MI-100234 }
        biografia: { type: string, nullable: true }
        ora_inizio: { type: string, example: "09:00" }
        ora_fine: { type: string, example: "17:00" }
        giorni_lavorativi:
          type: array
          description: Giorni di ricevimento in formato ISO-8601 (1 = lunedi ... 7 = domenica)
          items: { type: integer, example: 1 }
        specialita: { $ref: '#/components/schemas/Specialita' }

    Appuntamento:
      type: object
      properties:
        id: { type: integer, example: 1 }
        data_ora: { type: string, example: "2026-09-01 09:00" }
        stato: { type: string, enum: [prenotato, completato, annullato] }
        motivo: { type: string, nullable: true }
        note: { type: string, nullable: true }
        annullabile: { type: boolean, example: true }
        medico:
          type: object
          properties:
            id: { type: integer }
            nome_completo: { type: string }
            specialita: { type: string }
        paziente:
          type: object
          properties:
            id: { type: integer }
            nome_completo: { type: string }
        referto_id: { type: integer, nullable: true }

    Referto:
      type: object
      properties:
        id: { type: integer, example: 1 }
        diagnosi: { type: string }
        descrizione: { type: string }
        prescrizione: { type: string, nullable: true }
        data_emissione: { type: string, format: date }
        appuntamento: { $ref: '#/components/schemas/Appuntamento' }

    Paginazione:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        last_page: { type: integer, example: 3 }
        per_page: { type: integer, example: 10 }
        total: { type: integer, example: 24 }

    ElencoAppuntamenti:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Appuntamento' }
        meta: { $ref: '#/components/schemas/Paginazione' }

    ElencoReferti:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Referto' }
        meta: { $ref: '#/components/schemas/Paginazione' }

    Errore:
      type: object
      properties:
        message: { type: string, example: Lo slot selezionato non è più disponibile. }

    ErroreValidazione:
      type: object
      properties:
        message: { type: string, example: I dati forniti non sono validi. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    NonAutenticato:
      description: Token assente, scaduto o non valido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
    NonAutorizzato:
      description: L'utente non ha i permessi per l'operazione richiesta
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
    NonTrovato:
      description: Risorsa inesistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Errore' }
    ErroreValidazione:
      description: Dati della richiesta non validi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroreValidazione' }
